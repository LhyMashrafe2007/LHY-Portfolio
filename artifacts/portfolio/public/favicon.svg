<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg-grad)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="19" fill="none" stroke="url(#border)" stroke-width="2"/>

  <!-- === L === -->
  <!-- Vertical bar -->
  <rect x="10" y="24" width="7" height="36" rx="3.5" fill="url(#cyan-grad)" filter="url(#glow)"/>
  <!-- Horizontal bar -->
  <rect x="10" y="53" width="19" height="7" rx="3.5" fill="url(#cyan-grad)" filter="url(#glow)"/>

  <!-- === H === -->
  <!-- Left vertical -->
  <rect x="34" y="24" width="7" height="36" rx="3.5" fill="url(#cyan-grad)" filter="url(#glow)"/>
  <!-- Right vertical -->
  <rect x="49" y="24" width="7" height="36" rx="3.5" fill="url(#cyan-grad)" filter="url(#glow)"/>
  <!-- Middle horizontal -->
  <rect x="34" y="38.5" width="22" height="7" rx="3.5" fill="url(#cyan-grad)" filter="url(#glow)"/>

  <!-- === Y === -->
  <!-- Left diagonal arm: top-left to center -->
  <line x1="63" y1="24" x2="76" y2="44" stroke="url(#cyan-grad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Right diagonal arm: top-right to center -->
  <line x1="89" y1="24" x2="76" y2="44" stroke="url(#cyan-grad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Stem: center down -->
  <rect x="72.5" y="44" width="7" height="16" rx="3.5" fill="url(#cyan-grad)" filter="url(#glow)"/>

  <!-- Bottom accent -->
  <rect x="14" y="74" width="72" height="2" rx="1" fill="#22d3ee" opacity="0.3"/>
</svg>
